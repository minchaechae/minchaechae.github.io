<section id="news" class="news" aria-labelledby="news-heading">
  <h2 id="news-heading">News</h2>
  <ul class="news-list">
    {% for item in site.data.news %}
    <li>
      <span class="news-date">{{ item.date }}</span>
      <span>{{ item.text }}</span>
    </li>
    {% endfor %}
  </ul>
</section>
