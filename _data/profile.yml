name: Minchae Kim
role: PhD Student in Computer Science at Virginia Tech
interests: "Human-Computer Interaction · Extended Reality · Spatial Computing · 3D User Interface"

bio:
  - "I am a PhD Student in Computer Science at Virginia Tech, advised by Dr. Doug Bowman, and a member of the 3D Interaction Group. My M.S. research explored how to organize activities in VR as continuous journeys through space, helping people move between tasks without breaking their workflow and stay engaged."
  - "I am interested in how XR and AI can help people organize 3D space and build spatial workspaces that respond to their tasks and context."

