<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="{{ '/favicon.ico' | relative_url }}?v=2" />
    <meta name="description" content="{{ site.description | escape }}" />
    <meta name="author" content="{{ site.data.profile.name | escape }}" />
    <meta property="og:title" content="{{ site.data.profile.name | escape }}" />
    <meta property="og:description" content="{{ site.data.profile.role | escape }}" />
    <meta property="og:type" content="website" />
    <title>{{ page.title | default: site.title | escape }}</title>
    <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}" />
  </head>
  <body>
    <a class="skip-link" href="#main-content">Skip to content</a>
    {% include navbar.html %}
    <main id="main-content" class="page" tabindex="-1">
      {{ content }}
    </main>
    {% include footer.html %}
  </body>
</html>
